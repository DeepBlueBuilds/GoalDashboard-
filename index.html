<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Dashboard</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header class="top">

        <div>

            <div id="greeting">Good Morning</div>

            <div id="date"></div>

        </div>

        <div id="time"></div>

    </header>

    <section class="weather card">

        <h2>🌤 Weather</h2>

        <div id="weather">
            Loading...
        </div>

    </section>

    <section class="grid">

        <div class="card">

            <h2>⚖️ Weight</h2>

            <div class="big-number">
                190.0
            </div>

            <p>Goal: 180 lbs</p>

        </div>

        <div class="card">

            <h2>💳 Debt Freedom</h2>

            <div class="big-number">
                $22,470
            </div>

            <p>Remaining</p>

        </div>

        <div class="card">

            <h2>🎯 Today's Goals</h2>

            <ul>
                <li>✅ Workout</li>
                <li>⬜ Read 20 min</li>
                <li>✅ Drink Water</li>
            </ul>

        </div>

        <div class="card">

            <h2>🚀 Motivation</h2>

            <p>
                Small progress every day
                leads to big results.
            </p>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
