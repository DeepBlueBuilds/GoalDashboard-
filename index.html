<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <div>
            <h1 id="greeting">Good Morning</h1>
            <p id="date"></p>
        </div>

        <div id="time"></div>
    </header>

    <section class="weather-card">
        <div class="current-weather">
            <div id="currentTemp">--°</div>
            <div id="currentCondition">Loading...</div>
        </div>

        <div id="forecast" class="forecast"></div>
    </section>

    <div class="cards">

        <div class="card">
            <h2>⚖️ Weight</h2>
            <div class="value">190.2 lb</div>
            <div>Goal: 180 lb</div>
        </div>

        <div class="card">
            <h2>💳 Debt</h2>
            <div class="value">$22,470</div>
            <div>37% Paid Off</div>
        </div>

    </div>

    <div class="card">
        <h2>💪 Weekly Workouts</h2>
        <progress value="3" max="5"></progress>
        <p>3 of 5 Completed</p>
    </div>

    <div class="card">
        <h2>📅 Today</h2>
        <ul>
            <li>Team Meeting - 9:00 AM</li>
            <li>Baseball Practice - 6:00 PM</li>
        </ul>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
